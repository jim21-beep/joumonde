version: '3.8'

services:
  joumonde-web:
    build:
      context: .
      args:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    container_name: joumonde-shop
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - joumonde-network

networks:
  joumonde-network:
    driver: bridge
